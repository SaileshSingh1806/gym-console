name: Production Deployment to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Assets & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Node dependencies & Build Frontend Assets
        run: |
          npm ci
          npm run build

      - name: 🔑 Configure & Validate SSH Key
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          python3 -c '
          import os, sys
          raw = os.environ.get("SSH_KEY", "").strip()
          if not raw:
              sys.exit("ERROR: HOSTINGER_SSH_KEY secret is empty!")
          
          # Remove existing headers/footers and sanitize any whitespace/CRLF
          body = raw.replace("-----BEGIN OPENSSH PRIVATE KEY-----", "").replace("-----END OPENSSH PRIVATE KEY-----", "")
          body = "".join(body.split())

          # Reconstruct strict 70-char wrapped OpenSSH key
          lines = [body[i:i+70] for i in range(0, len(body), 70)]
          formatted_key = "-----BEGIN OPENSSH PRIVATE KEY-----\n" + "\n".join(lines) + "\n-----END OPENSSH PRIVATE KEY-----\n"
          
          key_path = os.path.expanduser("~/.ssh/deploy_key")
          with open(key_path, "w", newline="\n") as f:
              f.write(formatted_key)
          '
          chmod 600 ~/.ssh/deploy_key
          echo "Verifying SSH deploy key format with ssh-keygen:"
          ssh-keygen -y -f ~/.ssh/deploy_key
          echo "SSH key is valid and ready for authentication!"

      - name: 🚚 Transfer Compiled Frontend Assets (Vite Build)
        run: |
          scp -i ~/.ssh/deploy_key -P ${{ secrets.HOSTINGER_PORT || '65002' }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -r public/build ${{ secrets.HOSTINGER_USER || 'u644113968' }}@${{ secrets.HOSTINGER_HOST || '82.112.239.103' }}:/home/${{ secrets.HOSTINGER_USER || 'u644113968' }}/domains/gymdeskhub.com/public_html/
          scp -i ~/.ssh/deploy_key -P ${{ secrets.HOSTINGER_PORT || '65002' }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -r public/build ${{ secrets.HOSTINGER_USER || 'u644113968' }}@${{ secrets.HOSTINGER_HOST || '82.112.239.103' }}:/home/${{ secrets.HOSTINGER_USER || 'u644113968' }}/gym-console/public/

      - name: 🚀 Deploy Laravel Application on Hostinger
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -T -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_PORT || '65002' }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 ${{ secrets.HOSTINGER_USER || 'u644113968' }}@${{ secrets.HOSTINGER_HOST || '82.112.239.103' }} "REPO_TOKEN='$REPO_TOKEN' bash -s" << 'EOF'
            set -e

            PHP_BIN="/opt/alt/php84/usr/bin/php"
            APP_DIR="/home/u644113968/gym-console"
            WEB_DIR="/home/u644113968/domains/gymdeskhub.com/public_html"

            echo "=== Step 1: Navigating to project directory ==="
            cd "$APP_DIR"

            echo "=== Step 2: Safe Git Pull with Temporary Token ==="
            git fetch "https://x-access-token:${REPO_TOKEN}@github.com/SaileshSingh1806/gym-console.git" main
            git reset --hard FETCH_HEAD

            echo "=== Step 3: Install/Update Composer Dependencies ==="
            $PHP_BIN "$(command -v composer)" install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            echo "=== Step 4: Run Safe Database Migrations ==="
            $PHP_BIN artisan migrate --force

            echo "=== Step 5: Ensure Storage Symlink Exists ==="
            ln -sfn "$APP_DIR/storage/app/public" "$WEB_DIR/storage"
            ln -sfn "$APP_DIR/storage/app/public" "$APP_DIR/public/storage"

            echo "=== Step 6: Clear and Rebuild Laravel Caches ==="
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan route:cache
            $PHP_BIN artisan view:cache

            echo "=== Step 7: Verify Custom index.php Integrity ==="
            if ! grep -q "gym-console/bootstrap/app.php" "$WEB_DIR/index.php"; then
              echo "WARNING: $WEB_DIR/index.php does not reference gym-console. Please check custom index.php!"
            else
              echo "Verified: $WEB_DIR/index.php is intact and correctly linked."
            fi

            echo "=== Deployment Completed Successfully on Hostinger! ==="
          EOF

      - name: 🌐 Verify Live Site Health
        run: |
          STATUS=$(curl -s -k -o /dev/null -w "%{http_code}" https://gymdeskhub.com)
          echo "Live Site HTTP Status Code: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Website is live and healthy (HTTP $STATUS)!"
          else
            echo "⚠️ Warning: Expected HTTP 200-399, got $STATUS"
          fi

      - name: 🧹 Cleanup SSH Keys
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
